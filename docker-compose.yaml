name: skilins-api
services:
  # API Service
  skilins:
    restart: always
    container_name: skilins_skilins-api
    build:
      context: ./
      dockerfile: Dockerfile
      target: ${NODE_ENV}
    image: skilins-api:${APP_VERSION}
    ports:
      - '${APP_PORT}:${APP_PORT}'
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./:/usr/src/app
    user: root
    networks:
      - skilins-net
    command: >
      sh -c "npm install &&
             if [ \"$$NODE_ENV\" = \"development\" ]; then
               npm run start:dev;
             else
               npm run start:prod;
             fi"

  postgres:
    image: postgres:15-alpine
    container_name: skilins_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - '${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skilins-net
    restart: always

volumes:
  postgres-data:

networks:
  skilins-net:
    driver: bridge
